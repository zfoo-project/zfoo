syntax = "proto3";

option java_package = "com.zfoo.protocol.packet";
option java_outer_classname = "ProtobufObject";

// protoc -I=D:\zfoo\protocol\src\test\resources --java_out=D:\zfoo\protocol\src\test\java D:\zfoo\protocol\src\test\resources\speed.proto
// protoc -I=D:\Project\zfoo\protocol\src\test\resources --js_out=D:\Project\zfoo\protocol\src\test D:\Project\zfoo\protocol\src\test\resources\speed.proto
// npm install -g ts-protoc-gen
// protoc -I=D:\Project\zfoo\protocol\src\test\resources --ts_out=D:\Project\zfoo\protocol\src\test D:\Project\zfoo\protocol\src\test\resources\speed.proto

message ObjectB {
  bool flag = 1;
}

message ObjectA {
  int32 a = 1;
  map<int32, string> m = 2;
  ObjectB objectB = 3;
}

message ListInteger {
  repeated int32 a = 1;
}

message ListListInteger {
  repeated ListInteger a = 1;
}

message ListListListInteger {
  repeated ListListInteger a = 1;
}

message ListObjectA {
  repeated ObjectA a = 1;
}

message ListListObjectA {
  repeated ListObjectA a = 1;
}

message MapObjectA {
  ObjectA key = 1;
  ListInteger value = 2;
}

message MapListListObjectA {
  ListListObjectA key = 1;
  ListListListInteger value = 2;
}

message MapIntegerString {
  map<int32, string> a = 1;
}

message ListMapIntegerString {
  repeated MapIntegerString a = 1;
}

message MapListMapInteger {
  ListMapIntegerString key = 1;
  ListMapIntegerString value = 2;
}

message ProtobufComplexObject {
  // protobuf does not support single byte; use int instead, adding slight performance overhead
  int32 a = 1;
  int32 aa = 2;
  bytes aaa = 3;
  bytes aaaa = 4;

  // protobuf does not support single short; use int instead, adding slight performance overhead
  int32 b = 5;
  int32 bb = 6;
  // protobuf does not support single short; using bytes instead reduces performance overhead slightly
  bytes bbb = 7;
  bytes bbbb = 8;

  int32 c = 9;
  int32 cc = 10;
  repeated int32 ccc = 11;
  repeated int32 cccc = 12;

  int64 d = 13;
  int64 dd = 14;
  repeated int64 ddd = 15;
  repeated int64 dddd = 16;

  float e = 17;
  float ee = 18;
  repeated float eee = 19;
  repeated float eeee = 20;

  double f = 21;
  double ff = 22;
  repeated double fff = 23;
  repeated double ffff = 24;

  bool g = 25;
  bool gg = 26;
  repeated bool ggg = 27;
  repeated bool gggg = 28;

  // protobuf does not support char; use string instead, adding slight performance overhead
  string h = 29;
  string hh = 30;
  repeated string hhh = 31;
  repeated string hhhh = 32;

  string jj = 33;
  repeated string jjj = 34;

  ObjectA kk = 35;
  repeated ObjectA kkk = 36;

  repeated int32 l = 37;
  // protobuf does not support nested repeated fields; use a message instead, reducing performance overhead slightly
  repeated ListListInteger ll = 38;
  repeated ListObjectA lll = 39;
  repeated string llll = 40;
  repeated MapIntegerString lllll = 41;

  map<int32, string> m = 51;
  map<int32, ObjectA> mm = 52;
  repeated MapObjectA mmm = 53;           // protobuf does not support objects as map keys; use an array instead, greatly reducing performance overhead
  repeated MapListListObjectA mmmm = 54;  // protobuf does not support objects as map keys; use an array instead, greatly reducing performance overhead
  repeated MapListMapInteger mmmmm = 55;  // protobuf does not support objects as map keys (use an array instead) or sets (use a list instead), greatly reducing performance overhead


  repeated int32 s = 61;                  // protobuf does not support sets; use an array instead, greatly reducing performance overhead
  repeated ListListInteger ss = 62;       // protobuf does not support nested sets and lists; use an object instead, greatly reducing performance overhead
  repeated ListObjectA sss = 63;          // protobuf does not support nested sets and lists; use an object instead, greatly reducing performance overhead
  repeated string ssss = 64;              // protobuf does not support sets; use an array instead, greatly reducing performance overhead
  repeated MapIntegerString sssss = 65;   // protobuf does not support sets or nested maps; use an object instead, greatly reducing performance overhead
}


message ProtobufNormalObject {
  int32 a = 1;
  bytes aaa = 3;

  int32 b = 5;

  int32 c = 9;

  int64 d = 13;

  float e = 17;

  double f = 21;

  bool g = 25;

  string jj = 33;

  ObjectA kk = 35;

  repeated int32 l = 37;
  repeated int64 ll = 38;
  repeated ObjectA lll = 39;
  repeated string llll = 40;

  map<int32, string> m = 51;
  map<int32, ObjectA> mm = 52;

  repeated int32 s = 61;
  repeated string ssss = 64;
}

message ProtobufSimpleObject {
  int32 c = 9;
  bool g = 25;
}