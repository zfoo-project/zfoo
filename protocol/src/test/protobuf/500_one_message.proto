syntax = "proto3";
package test.message;

message OneMessage {
  Proj value = 1;
}

message SimpleObject {
  int64 aa = 1;
}

// Fields with tag > 1000 are treated as protocol fields requiring backward compatibility
message Proj {
  // This is a field comment
  int64 id = 1;
  string name = 2;
  string repoPath = 3;
  //zzzzzzz
  repeated int32 a = 4;
  map<int32, int64> b = 5;
  map<int32, string> c = 1000;
  map<int32, SimpleObject> d = 1001;
}